# Builds one native executable for the Quarkus Native Matrix extension (quarkus-native-matrix).
#
# Commit this file as .github/workflows/native-matrix.yml on the branch used by the github-actions runner
# (the default branch unless the 'ref' option is set). The extension dispatches it once per target and
# downloads the produced executable; you never need to trigger it by hand.
name: native-matrix
run-name: "native-matrix ${{ inputs.target }} ${{ inputs.correlation_id }}"

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Identifier used by the extension to find this run
        required: true
        type: string
      target:
        description: Matrix target name
        required: true
        type: string
      runs_on:
        description: Runner label
        required: true
        type: string
      sources_url:
        description: API URL of the zipped native sources (draft release asset)
        required: true
        type: string
      java_version:
        description: Java version of the GraalVM distribution
        required: true
        type: string
      distribution:
        description: GraalVM distribution (graalvm, graalvm-community, mandrel, liberica)
        required: true
        type: string
      retention_days:
        description: Retention of the artifact holding the executable
        required: false
        default: "1"
        type: string

permissions:
  contents: write   # read the draft release holding the native sources
  actions: read

jobs:
  native-image:
    name: native-image ${{ inputs.target }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 120
    steps:
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.distribution }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Download native sources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCES_URL: ${{ inputs.sources_url }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$SOURCES_URL" -o native-sources.zip
          mkdir native-sources
          cd native-sources && jar xf ../native-sources.zip

      - name: native-image (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: native-sources
        run: native-image @native-image.matrix.args

      - name: native-image (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: native-sources
        run: native-image.cmd @native-image.matrix.args

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.correlation_id }}
          path: native-sources/output/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
