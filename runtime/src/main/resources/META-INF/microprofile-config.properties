# One-command matrix builds: `mvn package -Dnative-matrix` (or -Dquarkus.native-matrix.build=true) enables the
# native build in "native sources" mode, which triggers the matrix. These are defaults with the lowest priority:
# values set in application.properties, Maven/Gradle properties or system properties win.
quarkus.native.enabled=${native-matrix:${quarkus.native-matrix.build:false}}
quarkus.native.sources-only=${native-matrix:${quarkus.native-matrix.build:false}}
