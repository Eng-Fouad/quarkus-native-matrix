quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."io.quarkiverse.nativematrix".level=INFO

# Targets used by the end-to-end validation (mvn -Pit package -Dnative-matrix, see the README)

# real Mandrel builder container, native sources mode
quarkus.native-matrix.target.linux-amd64.runner=docker

# same platform, full mode: the whole project is built in the container
quarkus.native-matrix.target.linux-amd64-full.platform=linux-amd64
quarkus.native-matrix.target.linux-amd64-full.runner=docker
quarkus.native-matrix.target.linux-amd64-full.mode=full
quarkus.native-matrix.target.linux-amd64-full.enabled=${e2e.full:false}

# the build machine, when it runs Windows; point graalvm-home at a GraalVM install
quarkus.native-matrix.target.windows-amd64.runner=local
quarkus.native-matrix.target.windows-amd64.enabled=${e2e.windows:false}

quarkus.native.resources.includes=native-matrix-greeting.txt

quarkus.native-matrix.packaging.jreleaser=true
quarkus.native-matrix.packaging.name=hello-matrix
