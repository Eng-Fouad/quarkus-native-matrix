name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['*.md']
  pull_request:
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21]
        include:
          # the release target of the extension
          - os: ubuntu-latest
            java: 17
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp install

      - name: Docker runner integration test
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw -B -ntp -pl deployment surefire:test -Dtest=DockerRunnerIT -Dnative-matrix.it.docker=true -Dsurefire.failIfNoSpecifiedTests=false

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7
